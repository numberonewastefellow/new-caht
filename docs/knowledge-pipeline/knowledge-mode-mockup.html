<style>

}

  --virtualai-accent:#6366f1; --virtualai-accent-subtle:rgba(99,102,241,.1); --virtualai-accent-glow:rgba(99,102,241,.22);
  --accent-contrast:#ffffff; --section-knowledge:#22c55e; --section-knowledge-bg:rgba(34,197,94,.14);

}

.dark.virtualai-ocean { --virtualai-accent:#60a5fa; --virtualai-accent-subtle:rgba(59,130,246,.1); --virtualai-accent-glow:rgba(59,130,246,.28); --accent-contrast:#04121f; }
.virtualai-emerald { --virtualai-accent:#059669; --virtualai-accent-subtle:rgba(52,211,153,.07); --virtualai-accent-glow:rgba(52,211,153,.2); }
.dark.virtualai-emerald { --virtualai-accent:#34d399; --virtualai-accent-subtle:rgba(52,211,153,.1); --virtualai-accent-glow:rgba(52,211,153,.26); --accent-contrast:#04120c; }

.dark.virtualai-violet { --virtualai-accent:#a78bfa; --virtualai-accent-subtle:rgba(167,139,250,.1); --virtualai-accent-glow:rgba(167,139,250,.26); --accent-contrast:#10081f; }

* { box-sizing:border-box; }
html,body { height:100%; margin:0; }
body { background:var(--background-tint-00); color:var(--text-05); font:14px/1.45 Inter,"Segoe UI",system-ui,sans-serif; }
#app { display:flex; flex-direction:column; height:100vh; min-width:1120px; }
button,input,select,textarea { font:inherit; color:inherit; }
button { cursor:pointer; background:none; border:0; }

.review .muted { white-space:nowrap; }

.btn { padding:7px 13px; border-radius:8px; border:1px solid var(--border-02); font-weight:500; background:var(--background-tint-00); white-space:nowrap; }

.palette .t { font-weight:600; font-size:13px; } .palette .d { font-size:12px; color:var(--text-03); }
.ico { width:30px; height:30px; flex:none; border-radius:8px; display:grid; place-items:center; background:var(--background-tint-02); border:1px solid var(--border-01); color:var(--text-04); font-weight:600; font-size:13px; }

.field { display:flex; flex-direction:column; gap:5px; }

/* Canvas */
.canvas { flex:1; position:relative; overflow:auto; min-width:0; background-color:var(--background-tint-01); background-image:radial-gradient(var(--border-01) 1px,transparent 1px); background-size:22px 22px; }

.pill text { fill:var(--accent-contrast); font-size:10px; font-weight:600; text-anchor:middle; dominant-baseline:central; }

.node.bad { border-color:var(--warning); }
.node .nh { display:flex; align-items:center; gap:9px; padding:10px 12px; border-bottom:1px solid var(--border-01); }
.node .ti { font-weight:600; font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.node .su { font-size:11px; color:var(--text-03); }
.node .no { color:var(--virtualai-accent); background:var(--virtualai-accent-subtle); font-size:11px; font-weight:600; padding:1px 6px; border-radius:5px; }
.node .nb { padding:9px 12px; display:grid; grid-template-columns:72px 1fr; gap:4px 8px; font-size:11.5px; }

.node .nb .v { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.chip { display:inline-block; padding:2px 8px; border-radius:99px; font-size:11px; font-weight:500; white-space:nowrap; }
.chip.warn { color:var(--warning); background:var(--warning-bg); }
.chip.ok { color:var(--success); background:var(--success-bg); }

.nf { padding:0 12px 10px; }
.startnode { position:absolute; width:118px; padding:14px 8px; text-align:center; border-radius:12px; color:var(--accent-contrast); background:linear-gradient(135deg,var(--virtualai-accent),color-mix(in srgb,var(--virtualai-accent) 78%,#000)); user-select:none; touch-action:none; cursor:grab; }
.startnode b { display:block; letter-spacing:.06em; font-size:12px; margin-top:3px; }
.endnode { position:absolute; width:96px; padding:14px 6px; text-align:center; border-radius:12px; color:#fff; background:var(--end-node); font-weight:700; font-size:12px; letter-spacing:.05em; user-select:none; touch-action:none; cursor:grab; }
.endnode small { display:block; font-weight:500; letter-spacing:0; font-size:10px; opacity:.9; }
.legend { position:absolute; left:14px; top:14px; width:214px; padding:11px 13px; border:1px solid var(--border-01); border-radius:10px; background:var(--background-tint-00); z-index:5; font-size:12px; pointer-events:none; }
.legend button { pointer-events:auto; }
.legend b { font-size:13px; }
.dropzone { position:absolute; left:50%; top:45%; transform:translate(-50%,-50%); padding:18px 26px; text-align:center; border:1.5px dashed var(--border-02); border-radius:12px; color:var(--text-03); background:var(--background-tint-00); }
.zoom { position:absolute; left:14px; bottom:14px; display:flex; flex-direction:column; border:1px solid var(--border-01); border-radius:8px; overflow:hidden; background:var(--background-tint-00); z-index:5; }
.zoom button { width:32px; height:30px; border-bottom:1px solid var(--border-01); }

.sticky-ui { position:sticky; left:0; top:0; width:0; height:0; z-index:6; }
.overlay-wrap { flex:1; position:relative; min-width:0; display:flex; }
.runslot.floating { position:absolute; left:50%; bottom:14px; transform:translateX(-50%); width:min(680px,calc(100% - 120px)); z-index:7; }
.runcard { padding:11px 14px; border:1px solid var(--border-02); border-radius:12px; background:var(--background-tint-00); box-shadow:0 8px 26px rgba(0,0,0,.3); display:flex; flex-direction:column; gap:8px; }
.bar { height:6px; border-radius:99px; background:var(--background-tint-03); overflow:hidden; }
.bar i { display:block; height:100%; background:var(--virtualai-accent); transition:width .35s; }

/* Right config panel */
.panel { width:460px; flex:none; border-left:1px solid var(--border-01); background:var(--background-tint-00); display:flex; flex-direction:column; min-height:0; }
.panel .ph { display:flex; align-items:center; gap:10px; padding:12px 14px; border-bottom:1px solid var(--border-01); }
.panel .pb { flex:1; overflow:auto; padding:14px; display:flex; flex-direction:column; gap:16px; }
.iconbtn { width:28px; height:28px; border-radius:6px; color:var(--text-03); }
.iconbtn:hover { background:var(--background-tint-02); }

/* Shared form pieces */
.opt { display:flex; gap:10px; align-items:center; width:100%; padding:9px 11px; text-align:left; border:1px solid var(--border-01); border-radius:10px; background:var(--background-tint-00); }
.opt:hover:not(:disabled) { border-color:var(--border-02); background:var(--background-tint-01); }
.opt.on { border-color:var(--virtualai-accent); background:var(--virtualai-accent-subtle); }
.opt:disabled { opacity:.5; cursor:not-allowed; }
.opt .t { font-weight:600; font-size:13px; } .opt .d { font-size:12px; color:var(--text-03); }
.grid2 { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
.box { padding:11px 12px; border-radius:10px; border:1px solid var(--border-01); background:var(--background-tint-01); }
.note { padding:9px 11px; border-radius:8px; font-size:12px; background:var(--background-tint-02); color:var(--text-04); }
.note.warn { background:var(--warning-bg); color:var(--warning); }
.note.bad { background:var(--danger-bg); color:var(--danger); }
.note.ok { background:var(--success-bg); color:var(--success); }
.sect { font-weight:600; font-size:13px; padding-bottom:6px; border-bottom:1px solid var(--border-01); }

/* Chunk list */
.stats { display:grid; grid-template-columns:repeat(3,1fr); gap:6px; }
.stat { padding:7px 9px; border-radius:8px; background:var(--background-tint-02); }

.chunk { padding:9px 11px; border:1px solid var(--border-01); border-radius:8px; background:var(--background-tint-00); font-size:12.5px; }
.chunk .ch { display:flex; justify-content:space-between; color:var(--text-03); font-size:11px; margin-bottom:4px; }
.chunk .ct { white-space:pre-wrap; word-break:break-word; max-height:96px; overflow:hidden; }
.chunk .ov { background:var(--virtualai-accent-glow); border-radius:3px; }
.chunks { display:flex; flex-direction:column; gap:6px; }

/* Wizard editor */
.wiz { flex:1; overflow:auto; background:var(--background-tint-01); }
.wizin { max-width:1040px; margin:0 auto; padding:6px 20px 30px; }
.stepper { display:flex; align-items:center; gap:8px; padding:16px 4px; }
.stp { display:flex; gap:9px; align-items:center; min-width:0; flex:none; }
.stp .c { width:34px; height:34px; border-radius:50%; display:grid; place-items:center; background:var(--background-tint-03); color:var(--text-02); font-weight:600; flex:none; }
.stp.cur .c { background:var(--virtualai-accent); color:var(--accent-contrast); }
.stp.done .c { background:var(--virtualai-accent-glow); color:var(--virtualai-accent); }
.stp .l { font-weight:600; font-size:13px; color:var(--text-03); } .stp .sb { font-size:11.5px; color:var(--text-02); }
.stp.cur .l { color:var(--virtualai-accent); }
.stpline { flex:1; min-width:12px; height:2px; background:var(--background-tint-03); border-radius:9px; }
.stpline.done { background:var(--virtualai-accent); }
.card { padding:18px; border:1px solid var(--border-01); border-radius:14px; background:var(--background-tint-00); }
.kblayout { display:grid; grid-template-columns:minmax(0,1fr) 250px; gap:16px; align-items:start; }
.kbside { padding:14px; position:sticky; top:0; gap:10px; font-size:13px; }
.filedrop { position:relative; display:flex; flex-direction:column; align-items:center; gap:4px; padding:30px 16px; border:1.5px dashed var(--border-02); border-radius:12px; cursor:pointer; text-align:center; }
.filedrop:hover,.filedrop.over,.filedrop:focus-within { border-color:var(--virtualai-accent); background:var(--virtualai-accent-subtle); }
.wizgrid { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:20px; align-items:start; }
.wizfoot { display:flex; justify-content:space-between; margin-top:14px; }
.summary { display:grid; grid-template-columns:140px 1fr; gap:8px 12px; }
.summary dt { color:var(--text-03); } .summary dd { margin:0; }

/* Pages */
.page { flex:1; overflow:auto; }
.pagein { max-width:1060px; margin:0 auto; padding:18px 24px 40px; }
.crumb { font-size:12px; color:var(--text-03); margin-bottom:8px; }
.page h1 { font-size:22px; font-weight:600; }
table { width:100%; border-collapse:collapse; font-size:13px; }
th { text-align:left; color:var(--text-03); font-weight:500; padding:8px 10px; border-bottom:1px solid var(--border-02); }

.doc .dt { font-weight:600; }
.badge { padding:3px 9px; border-radius:7px; background:var(--background-tint-02); font-size:12px; }
.drawer { position:fixed; right:0; top:0; bottom:0; width:520px; z-index:50; background:var(--background-tint-00); border-left:1px solid var(--border-02); display:flex; flex-direction:column; box-shadow:-14px 0 40px rgba(0,0,0,.35); }

.tile .t { font-weight:600; font-size:13px; } .tile .d { font-size:12px; color:var(--text-03); }

#toast[hidden] { display:none; }
</style>
</head>

<script>
'use strict';
/* ── Sample content ─────────────────────────────────────────────── */
const SAMPLE_CONTRACT = `Master Services Agreement

This Agreement is entered into between the Department of Revenue and the Service Provider. It sets out the terms under which services are delivered during the contract period.

1. Scope of Work. The Service Provider shall digitise land records for the listed districts, verify each record against the source register, and deliver a monthly progress report to the Project Officer. Work outside this scope needs a written change request.

2. Payment Terms. Invoices are raised monthly after the Project Officer accepts the progress report. Payment is due within 45 days of a valid invoice. Late delivery attracts a penalty of 0.5 percent of the monthly fee for each week of delay, capped at 10 percent.

3. Data Protection. All citizen data remains the property of the Department. The Service Provider shall store it only on approved servers inside India, restrict access to named staff, and report any breach within 24 hours of discovering it.

/* ── Chunking used by the preview (a browser approximation) ─────── */
function parseCsv(text){
  const rows=[];let row=[],f='',q=false;
  for(let i=0;i<text.length;i++){const ch=text[i];
    if(q){ if(ch==='"'&&text[i+1]==='"'){f+='"';i++;} else if(ch==='"') q=false; else f+=ch; }
    else if(ch==='"') q=true;
    else if(ch===','){row.push(f);f='';}
    else if(ch==='\n'){row.push(f.replace(/\r$/,''));rows.push(row);row=[];f='';}
    else f+=ch;
  }
  if(f.length||row.length){row.push(f);rows.push(row);}
  return rows.filter(r=>r.some(c=>c.trim()));
}
function currentSample(){ return S.uploaded||SAMPLES[S.sampleKey]; }
function sampleColumns(){ const s=currentSample(); return s.table?(parseCsv(s.text)[0]||[]):[]; }
function clean(text,c){
  let t=text;
  if(c.cleanSpaces) t=t.replace(/[ \t]+/g,' ').replace(/\n{3,}/g,'\n\n');
  if(c.stripUrls) t=t.replace(/https?:\/\/\S+/g,'').replace(/\S+@\S+\.\S+/g,'');
  return t;
}
function splitBy(pieces,maxT,ovT){
  const maxW=Math.max(5,Math.floor(maxT/1.33)),ovW=Math.floor(ovT/1.33),step=Math.max(1,maxW-ovW);
  const out=[];let cur=[],carried=0;
  const flush=()=>{ if(cur.length>carried){ out.push({text:cur.join(' '),overlapWords:carried}); const tail=ovW?cur.slice(-ovW):[]; cur=tail; carried=tail.length; } };
  for(const p of pieces){
    const ws=words(p); if(!ws.length) continue;
    if(ws.length>maxW){ flush(); cur=[];carried=0;
      for(let i=0;i<ws.length;i+=step){ out.push({text:ws.slice(i,i+maxW).join(' '),overlapWords:i?Math.min(ovW,ws.length-i):0}); if(i+maxW>=ws.length) break; }
      continue; }
    if(cur.length+ws.length>maxW) flush();
    cur.push(...ws);
  }
  flush();
  return out;
}
function tableChunks(s){
  const rows=parseCsv(s.text),head=rows[0]||[];
  const out=[{text:`File: ${s.name}\nColumns: ${head.join(', ')}\nRows: ${Math.max(0,rows.length-1)}`,overlapWords:0}];
  const body=rows.slice(1).map(r=>head.map((h,i)=>`${h}: ${r[i]??''}`).join(' | '));
  splitBy(body,MAX_TOKENS,0).forEach(c=>out.push(c));
  return out;
}
function runChunker(){
  const c=S.chunker,s=currentSample(),warnings=[];let chunks=[];
  if(c.strategy==='qa'){
    if(!s.table) return {chunks:[],warnings:[],error:'Q&A needs a CSV or Excel file with one question and answer per row. Try "FAQ sheet.csv".'};
    const rows=parseCsv(s.text),head=rows[0]||[];
    const qi=head.indexOf(c.qCol||head[0]),ai=head.indexOf(c.aCol||head[1]);
    if(qi<0||ai<0) return {chunks:[],warnings:[],error:'Those columns aren\'t in this file. Choose the question and answer columns.'};
    if(qi===ai) return {chunks:[],warnings:[],error:'The question and answer columns must be different.'};
    rows.slice(1).forEach(r=>{ if(r[qi]?.trim()&&r[ai]?.trim()) chunks.push({text:`Question: ${r[qi]}\nAnswer: ${r[ai]}`,overlapWords:0}); });
    const skipped=rows.length-1-chunks.length;
    if(skipped>0) warnings.push(`${skipped} row(s) skipped because a question or answer is empty.`);
  } else if(s.table){
    chunks=tableChunks(s);
    warnings.push('Spreadsheets use the table chunker under Automatic and General. Choose Q&A for one chunk per row.');
  } else if(c.strategy==='automatic'){
    chunks=splitBy(s.text.split(/(?<=[.!?])\s+/),MAX_TOKENS,0);
  } else {
    const d=String(c.delimiter).replace(/\\n/g,'\n').replace(/\\t/g,'\t');
    if(!d) return {chunks:[],warnings:[],error:null};
    chunks=splitBy(clean(s.text,c).split(d),Math.min(c.maxTokens||1,MAX_TOKENS),Math.max(0,c.overlap||0));
  }
  return {chunks,warnings,error:null};
}

    const dx=Math.max(40,Math.abs(x2-x1)/2),mx=(x1+x2)/2,my=(y1+y2)/2;
    out+=`<path class="edge" d="M${x1},${y1} C${x1+dx},${y1} ${x2-dx},${y2} ${x2},${y2}"/>
      <circle class="dot" cx="${x1}" cy="${y1}" r="4"/><circle class="dot" cx="${x2}" cy="${y2}" r="4"/>
      <g class="pill"><rect x="${mx-23}" y="${my-9}" width="46" height="18" rx="9"/><text x="${mx}" y="${my}">then #${i+1}</text></g>`;
  }
  svg.innerHTML=out;
}

function runHTML(){
  const R=S.run,iss=issues(),changed=S.indexedHash&&S.indexedHash!==configHash();
  if(R.state==='running') return `<div class="runcard"><div class="row"><b class="grow">${esc(R.stage)}</b><span class="small muted">${R.pct}%</span></div><div class="bar" role="progressbar" aria-valuenow="${R.pct}" aria-valuemin="0" aria-valuemax="100"><i style="width:${R.pct}%"></i></div></div>`;
  if(iss.length) return `<div class="runcard"><div class="row"><div class="grow"><b>Finish setup to start</b><div class="small muted">${esc(iss[0])}${iss.length>1?` (+${iss.length-1} more)`:''}</div></div><button class="btn primary" disabled>Start indexing</button></div></div>`;
  if(changed) return `<div class="runcard"><div class="row"><div class="grow"><b style="color:var(--warning)">Settings changed since the last index</b><div class="small muted">Existing documents keep their old chunks until you re-index.</div></div><button class="btn sm" data-act="history">Run history</button><button class="btn primary" data-act="start">Apply and re-index</button></div></div>`;
  if(S.indexedHash){ const n=S.indexed; return `<div class="runcard"><div class="row"><div class="grow"><b style="color:var(--success)">✓ Indexed</b><div class="small muted">${n.docs} documents · ${n.chunks} chunks · ${esc(n.config)}</div></div><button class="btn sm" data-act="history">Run history</button><button class="btn sm" data-act="viewchunks">View chunks</button>${S.agentCreated?'':'<button class="btn sm primary" data-act="mkagent">Create an agent</button>'}</div></div>`; }
  const existing=S.source&&!S.source.isNew;
  return `<div class="runcard"><div class="row"><div class="grow"><b>Ready</b><div class="small muted">${existing?`This re-indexes ${S.source.docs} existing documents with the new settings.`:'The source stays paused until you start.'}</div></div><button class="btn primary" data-act="start">${existing?'Apply and re-index':'Start indexing'}</button></div></div>`;
}
function refreshRun(){ $$('.runslot').forEach(el=>el.innerHTML=runHTML()); }
function startRun(){
  if(issues().length) return;
  if(configHash()!==S.savedHash) saveVersion(true);
  const reindex=!!S.indexedHash||!S.source.isNew;
  const st=['Scheduled','Fetching documents','Extracting text','Chunking','Embedding','Writing to the index'];
  S.run={state:'running',pct:0,stage:st[0]};refreshRun();
  const iv=setInterval(()=>{
    S.run.pct=Math.min(100,S.run.pct+7);
    S.run.stage=st[Math.min(st.length-1,Math.floor(S.run.pct/100*st.length))];
    if(S.run.pct>=100){ clearInterval(iv); finishRun(reindex); }
    refreshRun();
  },260);
}
function finishRun(reindex){
  const r=runChunker(),s=currentSample();
  const docs=S.source?.docs||1,chunks=Math.max(r.chunks.length,1)*docs;
  S.run={state:'idle',pct:0,stage:''};
  S.indexedHash=configHash();
  if(S.source.isNew){ const x=allConnected().find(c=>c.id===S.source.id); if(x) x.docs=x.docs||1; }
  S.indexed={docs,chunks,config:chunkerSummary(),docName:s.name,list:r.chunks,strategy:chunkerSummary()};
  S.attempts.unshift({n:S.attempts.length+1,kind:reindex?'Re-index':'First index',config:chunkerSummary(),version:S.version,docs,chunks,when:'Just now'});
  if(S.coll.mode==='new'&&S.coll.newName.trim()&&!S.extra.collections.some(c=>c.name===S.coll.newName.trim())){
    S.extra.collections.push({id:'n'+Date.now(),name:S.coll.newName.trim(),isPublic:S.coll.isPublic});
  }
  refreshRun();
  toast('Indexing finished (simulated).');
}
function saveVersion(silent){
  const iss=issues();
  if(iss.length){ if(!silent){ toast(iss.join(' ')); } return false; }
  const h=configHash();
  if(h===S.savedHash){ if(!silent) toast('No changes to save.'); return true; }
  S.version=(S.version||0)+1;S.savedHash=h;
  S.versions.unshift({v:S.version,summary:`${S.source?.name} → ${chunkerSummary()} → ${collectionName()}`,chunker:{...S.chunker},coll:{...S.coll},source:S.source,when:'Just now',who:'You'});
  if(!silent) toast(S.indexedHash&&S.indexedHash!==h?`Saved version ${S.version}. Nothing is re-indexed until you choose to.`:`Saved version ${S.version}.`);
  return true;
}

function addUploads(files){

  for(const f of files){

      reading=true;
      const reader=new FileReader();
      reader.onload=()=>{ S.uploaded={name:f.name,text:String(reader.result),table:/\.csv$/i.test(f.name)};render(); };

  }

/* ── Node dragging on the canvas ────────────────────────────────── */
let drag=null;
document.addEventListener('pointerdown',ev=>{
  const n=ev.target.closest?.('[data-node]'); if(!n||ev.button!==0) return;
  const id=n.dataset.node,store=S.view==='seq'?S.seq.pos:S.pos;
  drag={id,store,sx:ev.clientX,sy:ev.clientY,ox:store[id].x,oy:store[id].y,moved:false,el:n};
});
document.addEventListener('pointermove',ev=>{
  if(!drag) return;
  const z=S.view==='seq'?1:S.zoom,dx=(ev.clientX-drag.sx)/z,dy=(ev.clientY-drag.sy)/z;
  if(!drag.moved&&Math.hypot(dx,dy)<4) return;
  drag.moved=true;
  const p=drag.store[drag.id];p.x=Math.max(0,drag.ox+dx);p.y=Math.max(0,drag.oy+dy);
  drag.el.style.left=p.x+'px';drag.el.style.top=p.y+'px';drawEdges();
});
document.addEventListener('pointerup',()=>{
  if(!drag) return;
  const d=drag;drag=null;
  if(!d.moved) openNode(d.id);
});
function openNode(id){
  if(S.view==='seq'){ if(id==='ks'||id==='agent'){ S.seq.sel=id; render(); } return; }
  if(ORDER.includes(id)){ S.panel=id; render(); }
}

/* ── Palette drag and drop ──────────────────────────────────────── */
document.addEventListener('dragstart',ev=>{
  const p=ev.target.closest?.('[data-pal]'); if(!p||p.classList.contains('used')) return;
  ev.dataTransfer.setData('text/plain',p.dataset.pal);ev.dataTransfer.effectAllowed='copy';
});
document.addEventListener('dragover',ev=>{ const c=ev.target.closest?.('[data-drop]'); if(c){ ev.preventDefault(); c.classList.add('over'); } });
document.addEventListener('dragleave',ev=>{ const c=ev.target.closest?.('[data-drop]'); if(c&&!c.contains(ev.relatedTarget)) c.classList.remove('over'); });
document.addEventListener('drop',ev=>{
  const c=ev.target.closest?.('[data-drop]'); if(!c) return;
  ev.preventDefault();c.classList.remove('over');
  const t=ev.dataTransfer.getData('text/plain'); if(!ORDER.includes(t)||S.placed.includes(t)) return;
  const r=$('#inner').getBoundingClientRect();
  S.pos[t]={x:Math.max(0,(ev.clientX-r.left)/S.zoom-125),y:Math.max(0,(ev.clientY-r.top)/S.zoom-40)};
  placeStep(t);
});
function placeStep(t){
  S.placed.push(t);S.panel=t;
  if(S.placed.length===3) toast('All three steps are connected. Set them up, then start indexing.');
  render();
}

  reset(){ S=freshState();render(); },
  newkb(){ const k=S.extra;S=freshState();S.extra=k;render(); },

  tocanvas(){ S.view='canvas';S.menu=null;if(!S.placed.length) S.placed=[...ORDER];render(); },
  purpose(e){ const p=e.dataset.p;S.purpose=p;Object.assign(S.chunker,PRESETS[p],{preset:p});delete S.chunker.label;
    if(PRESETS[p].strategy==='qa'&&!currentSample().table){ S.sampleKey='faq';S.uploaded=null; } render(); },

  removefile(e){ S.uploads.splice(+e.dataset.i,1);syncUploadSource();render(); },
  createkb(){ const iss=issues();
    if(S.review.mkAgent&&S.coll.mode==='none') iss.push('An agent needs a collection.');
    if(iss.length){ const w=$('#wizerr'); if(w) w.innerHTML=`<div class="note bad" role="alert" style="margin-bottom:12px">${esc(iss.join(' '))}</div>`; return; }
    S.created=true;S.placed=[...ORDER];saveVersion(true);
    if(S.review.mkAgent) S.agentCreated=S.review.agentName.trim()||`${S.name.trim()} assistant`;
    if(S.coll.mode==='new'&&!S.extra.collections.some(c=>c.name===S.coll.newName.trim())) S.extra.collections.push({id:'n'+Date.now(),name:S.coll.newName.trim(),isPublic:S.coll.isPublic});
    S.wizStep=5;render();
    if(S.review.startNow) startRun(); },
  mode(e){ const m=e.dataset.m;
    if(S.view==='seq'){ if(m==='llm') toast('Knowledge Search works in Sequential mode for now, so it would be hidden in LLM Decision.'); else if(m==='knowledge') toast('The mode is chosen when a workflow is created and can\'t be switched later.'); return; }
    if(m!=='knowledge') toast('Knowledge bases always use Knowledge mode. It can\'t be switched later.'); },
  sidetab(e){ S.sideTab=e.dataset.t;render(); },
  legend(){ S.legend=false;render(); },
  zoom(e){ const z=e.dataset.z;S.zoom= z==='fit'?1:Math.min(1.5,Math.max(.5,S.zoom+(z==='in'?.1:-.1)));const i=$('#inner');if(i)i.style.transform=`scale(${S.zoom})`; },
  addstep(e){ const t=e.dataset.type; if(S.placed.includes(t)) return; S.pos[t]={...SLOTS[t]}; placeStep(t); },
  closepanel(){ S.panel=null;render(); },
  removestep(e){ S.placed=S.placed.filter(t=>t!==e.dataset.type);S.panel=null;render(); },
  picksource(e){ const c=allConnected().find(x=>x.id===e.dataset.id); if(!c||c.pipeline) return; S.source=c;render(); },
  addsource(){ S.addFlow=freshAddFlow();S.modal='addsource';render(); },
  pickkind(e){ S.addFlow.kind=e.dataset.k;S.addFlow.step=1;S.addFlow.connName=`${e.dataset.k}: new source`;render(); },
  addback(){ S.addFlow.step=0;render(); },
  addcreate(){ const f=S.addFlow; if(!f.connName.trim()){ toast('Name the connector.'); return; }
    const c={id:'x'+Date.now(),name:f.connName.trim(),kind:f.kind,docs:12,chunker:'Automatic',isNew:true,sync:{refresh:f.refresh,prune:f.prune,start:f.start,access:f.access}};
    S.extra.connected.unshift(c);S.source=c;S.modal=null;S.srcTab='connected';S.srcSearch='';S.addFlow=freshAddFlow();render();toast('Source added and paused.'); },
  closemodal(){ S.modal=null;render(); },
  strategy(e){ const c=S.chunker;c.strategy=e.dataset.s;c.preset=e.dataset.s==='automatic'?'automatic':e.dataset.s==='qa'?'faq':'custom';
    if(c.strategy==='qa'&&!currentSample().table){ S.sampleKey='faq';S.uploaded=null; } render(); },
  sample(e){ S.sampleKey=e.dataset.k;S.uploaded=null;render(); },
  collmode(e){ S.coll.mode=e.dataset.m;render(); },
  versions(){ S.modal='versions';render(); },
  history(){ S.modal='history';render(); },
  restore(e){ const v=S.versions.find(x=>x.v===+e.dataset.v); if(!v) return;
    S.chunker={...v.chunker};S.coll={...v.coll};S.source=v.source;S.modal=null;S.savedHash=null;saveVersion(true);render();toast(`Restored version ${v.v} as version ${S.version}. Documents aren't re-indexed until you choose to.`); },
  save(){ saveVersion(false);render(); },
  start(){ startRun(); },
  viewchunks(){ S.view='explorer';S.drawer='current';render(); },
  mkagent(){ S.view='seq';if(!S.agentCreated&&S.created) S.agentCreated=`${S.name.trim()} assistant`;const id=S.coll.mode==='existing'?S.coll.id:S.extra.collections.find(c=>c.name===S.coll.newName.trim())?.id;
    if(id&&!S.seq.collections.includes(id)) S.seq.collections.push(id);S.seq.sel='ks';render();toast('A workflow using this collection (simulated).'); },
  wizgo(e){ S.wizStep=+e.dataset.i;render(); },
  wizback(){ S.wizStep=Math.max(0,S.wizStep-1);render(); },
  wiznext(){ const m=wizardCheck(); if(m){ $('#wizerr').innerHTML=`<div class="note bad" role="alert" style="margin-bottom:12px">${esc(m)}</div>`; return; }
    S.wizStep++;render(); },
  seqtab(e){ S.seq.tab=e.dataset.t;render(); },
  seqclose(){ S.seq.sel=null;render(); },
  seqsave(){ toast(S.seq.collections.length?'Saved (simulated).':'Knowledge Search needs at least one collection.'); },
  seqtest(){ const term=($('#f-test')?.value||'').trim().toLowerCase();
    const pool=S.indexed?.list?.length?S.indexed.list:splitBy(SAMPLE_CONTRACT.split(/\n\n/),300,0);
    const hits=pool.map(c=>({c,s:term?words(term).filter(w=>c.text.toLowerCase().includes(w)).length:1})).filter(x=>x.s>0).sort((a,b)=>b.s-a.s).slice(0,Math.min(3,S.seq.topK||3));
    S.seq.test=hits.map((x,i)=>({title:S.indexed?.docName||'Sample contract.txt',text:x.c.text.slice(0,140)+'…',link:'#',score:+(0.92-i*0.11).toFixed(2)}));
    const r=$('#seqresult'); if(r) r.innerHTML=seqResult(); },
  drawer(e){ S.drawer=e.dataset.d;render(); },
  closedrawer(){ S.drawer=null;render(); },
};
document.addEventListener('click',ev=>{
  if(ev.target.dataset?.act==='closemodal-scrim'){ S.modal=null;render();return; }
  const el=ev.target.closest?.('[data-act]'); if(!el||el.disabled) return;
  const fn=ACTIONS[el.dataset.act]; if(fn) fn(el);
  else if(S.menu&&!ev.target.closest('.navmenu')){ S.menu=null;render(); }
});
document.addEventListener('keydown',ev=>{
  if(ev.key==='Escape'){ if(S.modal){ S.modal=null;render(); } else if(S.drawer){ S.drawer=null;render(); } else if(S.menu){ S.menu=null;render(); } }
  if((ev.key==='Enter'||ev.key===' ')&&ev.target.matches?.('[data-node]')){ ev.preventDefault();openNode(ev.target.dataset.node); }
});

/* ── Form input ─────────────────────────────────────────────────── */
function afterInput(el){
  if(el.dataset.catalog){ const q=S.addFlow.search.toLowerCase();const g=$('#catgrid');if(g) g.innerHTML=catalogGrid(CATALOG.filter(([n,d])=>n.toLowerCase().includes(q)||d.toLowerCase().includes(q))); return; }
  if(el.dataset.bind?.startsWith('addFlow')) return;
  if(el.dataset.srcsearch){ const l=$('#srclist'); if(l) l.innerHTML=sourceRows(S.srcSearch); return; }
  if(el.dataset.bind==='name'&&!S.coll.touched) S.coll.newName=S.name;
  if(el.dataset.bind==='coll.newName') S.coll.touched=true;
  $$('.kbside').forEach(n=>n.innerHTML=kbSummary());
  if(el.dataset.seqref){ refreshCanvas(); return; }
  if(el.dataset.bind==='name'){ const t=$('[data-slot=title]'); if(t) t.textContent=S.name||'Untitled'; }
  if(el.dataset.bind?.startsWith('chunker.')){
    if(el.dataset.bind!=='chunker.qCol'&&el.dataset.bind!=='chunker.aCol') S.chunker.preset=S.chunker.strategy==='qa'?'faq':'custom';
    $$(`[data-bind="${el.dataset.bind}"]`).forEach(o=>{ if(o!==el) o.value=getPath(S,el.dataset.bind); });
    const e=chunkerErrors();
    $$('[data-err]').forEach(n=>n.textContent=e[n.dataset.err]||'');
    const p=$('#f-preset'); if(p&&S.chunker.preset==='custom'&&p.value!=='custom'){ if(!$('option[value=custom]',p)) p.insertAdjacentHTML('beforeend','<option value="custom">Custom</option>'); p.value='custom'; }
  }
  $$('.previewslot').forEach(n=>n.innerHTML=previewHTML());
  refreshCanvas();refreshRun();
}
document.addEventListener('input',ev=>{
  const el=ev.target; if(!el.dataset?.bind) return;
  let v=el.type==='checkbox'?el.checked:el.value;
  if(el.dataset.num) v=v===''?NaN:Number(v);
  setPath(S,el.dataset.bind,v);
  if(el.dataset.refresh) render(); else afterInput(el);
});
document.addEventListener('change',ev=>{
  const el=ev.target,a=el.dataset?.actChange; if(!a) return;
  if(a==='accent'){ const r=document.documentElement;[...r.classList].filter(c=>c.startsWith('virtualai-')).forEach(c=>r.classList.remove(c)); if(el.value) r.classList.add(el.value); drawEdges(); }
  if(a==='preset'){ const p=PRESETS[el.value]; if(!p) return; Object.assign(S.chunker,p,{preset:el.value}); delete S.chunker.label;
    if(p.strategy==='qa'&&!currentSample().table){ S.sampleKey='faq';S.uploaded=null; } render(); }
  if(a==='startmode'){ S.review.startNow=el.value==='now';render(); }
  if(a==='kbupload'){ if(el.files?.length) addUploads([...el.files]); }
  if(a==='collcheck'){ const list=S.seq[el.dataset.path],i=list.indexOf(el.value); if(el.checked&&i<0) list.push(el.value); if(!el.checked&&i>=0) list.splice(i,1); render(); }
  if(a==='upload'){ const f=el.files?.[0]; if(!f) return;
    if(f.size>15*1024*1024){ toast('That file is over the 15 MB preview limit.'); return; }
    const reader=new FileReader();
    reader.onload=()=>{ S.uploaded={name:f.name,text:String(reader.result),table:/\.csv$/i.test(f.name)};render(); };
    reader.onerror=()=>toast('Could not read that file.');
    reader.readAsText(f); }
});
document.addEventListener('dragover',ev=>{ const d=ev.target.closest?.('[data-filedrop]'); if(d){ ev.preventDefault(); d.classList.add('over'); } });
document.addEventListener('dragleave',ev=>{ const d=ev.target.closest?.('[data-filedrop]'); if(d&&!d.contains(ev.relatedTarget)) d.classList.remove('over'); });
document.addEventListener('drop',ev=>{ const d=ev.target.closest?.('[data-filedrop]'); if(d){ ev.preventDefault(); if(ev.dataTransfer.files.length) addUploads([...ev.dataTransfer.files]); } });
window.addEventListener('resize',drawEdges);
render();
</script>
