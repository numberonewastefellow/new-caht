{{- if and (not .Values.auth.existingSecret) .Values.auth.apiToken }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "code-interpreter.fullname" . }}-auth
  labels:
    {{- include "code-interpreter.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.auth.existingSecretKey }}: {{ .Values.auth.apiToken | quote }}
{{- end }}
