# =============================================================================
# SEED TEST — Fresh DB + API server for testing seed_all.py
# =============================================================================
# Spins up a fresh Postgres + API server + nginx on alternate ports, reusing
# existing OpenSearch, Redis, model servers, and MinIO from the main stack.
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.seed-test.yml up -d seed_test_db seed_test_api seed_test_nginx
#
# Then run:
#   cd ../../backend/tests
#   python seed_all.py --url http://localhost:3081 --no-icons
#
# Cleanup:
#   docker compose -f docker-compose.yml -f docker-compose.seed-test.yml rm -sf seed_test_db seed_test_api seed_test_nginx
#   docker volume rm virtualai_seed_test_db_volume
# =============================================================================

services:
  seed_test_db:
    image: postgres:15.2-alpine
    shm_size: 256m
    command: -c 'max_connections=50'
    restart: "no"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - seed_test_db_volume:/var/lib/postgresql/data

  seed_test_api:
    image: ${OM_BACKEND_IMAGE:-om/om-backend:${IMAGE_TAG:-latest}}
    command: >
      /bin/sh -c "alembic upgrade head &&
      echo \"Starting Seed Test API Server\" &&
      uvicorn om.main:app --host 0.0.0.0 --port 8080"
    env_file:
      - path: .env
        required: false
    depends_on:
      seed_test_db:
        condition: service_healthy
      opensearch:
        condition: service_started
      cache:
        condition: service_started
      inference_model_server:
        condition: service_started
    restart: "no"
    environment:
      - AUTH_TYPE=basic
      - FILE_STORE_BACKEND=s3
      - POSTGRES_HOST=seed_test_db
      - REDIS_HOST=cache
      - MODEL_SERVER_HOST=inference_model_server
      - S3_ENDPOINT_URL=http://minio:9000
      - S3_AWS_ACCESS_KEY_ID=minioadmin
      - S3_AWS_SECRET_ACCESS_KEY=minioadmin
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "2"

  seed_test_nginx:
    image: nginx:1.25.4-alpine
    restart: "no"
    depends_on:
      - seed_test_api
    ports:
      - "3081:80"
    volumes:
      - ./seed-test-nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  seed_test_db_volume:
