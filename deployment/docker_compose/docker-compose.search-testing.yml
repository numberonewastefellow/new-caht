name: onyx

services:
  api_server:
    image: om/om-backend:${IMAGE_TAG:-latest}
    build:
      context: ../../backend
      dockerfile: Dockerfile
    command: >
      /bin/sh -c "alembic upgrade head &&
      echo \"Starting VertualAI Api Server\" &&
      uvicorn om.main:app --host 0.0.0.0 --port 8080"
    depends_on:
      - relational_db
      - opensearch
      - cache
      - minio
    restart: unless-stopped
    ports:
      - "8080"
    env_file:
      - .env_eval
    environment:
      - AUTH_TYPE=disabled
      - POSTGRES_HOST=relational_db
      - REDIS_HOST=cache
      - EMBEDDING_SERVER_URL=${EMBEDDING_SERVER_URL:-http://cortex_embed:8000/v1/embeddings}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-nomic-ai/nomic-embed-text-v1}
      - EMBEDDING_API_KEY=${EMBEDDING_API_KEY:-}
      # Texts per /v1/embeddings request (backend default is 512, too big for a small GPU)
      - EMBEDDING_BATCH_SIZE=${EMBEDDING_BATCH_SIZE:-64}
      - RERANK_ENABLED=${RERANK_ENABLED:-false}
      - RERANK_SERVER_URL=${RERANK_SERVER_URL:-http://cortex_rerank:8000/v1/rerank}
      - RERANK_MODEL=${RERANK_MODEL:-BAAI/bge-reranker-v2-m3}
      - RERANK_API_KEY=${RERANK_API_KEY:-}
      - RERANK_TOP_N=${RERANK_TOP_N:-20}
      - RERANK_PROTECT_TOP_K=${RERANK_PROTECT_TOP_K:-2}
      - ENV_SEED_CONFIGURATION=${ENV_SEED_CONFIGURATION:-}
      # MinIO configuration
      - S3_ENDPOINT_URL=${S3_ENDPOINT_URL:-http://minio:9000}
      - S3_AWS_ACCESS_KEY_ID=${S3_AWS_ACCESS_KEY_ID:-minioadmin}
      - S3_AWS_SECRET_ACCESS_KEY=${S3_AWS_SECRET_ACCESS_KEY:-minioadmin}
      - S3_FILE_STORE_BUCKET_NAME=${S3_FILE_STORE_BUCKET_NAME:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "6"

  background:
    image: om/om-backend:${IMAGE_TAG:-latest}
    build:
      context: ../../backend
      dockerfile: Dockerfile
    command: /app/scripts/supervisord_entrypoint.sh
    depends_on:
      - relational_db
      - opensearch
      - cache
    restart: unless-stopped
    env_file:
      - .env_eval
    environment:
      - USE_LIGHTWEIGHT_BACKGROUND_WORKER=${USE_LIGHTWEIGHT_BACKGROUND_WORKER:-true}
      - AUTH_TYPE=disabled
      - POSTGRES_HOST=relational_db
      - REDIS_HOST=cache
      - EMBEDDING_SERVER_URL=${EMBEDDING_SERVER_URL:-http://cortex_embed:8000/v1/embeddings}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-nomic-ai/nomic-embed-text-v1}
      - EMBEDDING_API_KEY=${EMBEDDING_API_KEY:-}
      # Texts per /v1/embeddings request (backend default is 512, too big for a small GPU)
      - EMBEDDING_BATCH_SIZE=${EMBEDDING_BATCH_SIZE:-64}
      - RERANK_ENABLED=${RERANK_ENABLED:-false}
      - RERANK_SERVER_URL=${RERANK_SERVER_URL:-http://cortex_rerank:8000/v1/rerank}
      - RERANK_MODEL=${RERANK_MODEL:-BAAI/bge-reranker-v2-m3}
      - RERANK_API_KEY=${RERANK_API_KEY:-}
      - RERANK_TOP_N=${RERANK_TOP_N:-20}
      - RERANK_PROTECT_TOP_K=${RERANK_PROTECT_TOP_K:-2}
      - ENV_SEED_CONFIGURATION=${ENV_SEED_CONFIGURATION:-}
      # MinIO configuration
      - S3_ENDPOINT_URL=${S3_ENDPOINT_URL:-http://minio:9000}
      - S3_AWS_ACCESS_KEY_ID=${S3_AWS_ACCESS_KEY_ID:-minioadmin}
      - S3_AWS_SECRET_ACCESS_KEY=${S3_AWS_SECRET_ACCESS_KEY:-minioadmin}
      - S3_FILE_STORE_BUCKET_NAME=${S3_FILE_STORE_BUCKET_NAME:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - log_store:/var/log/om
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "6"

  web_server:
    image: om/om-web-server:${IMAGE_TAG:-latest}
    build:
      context: ../../web
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_DISABLE_LOGOUT=${NEXT_PUBLIC_DISABLE_LOGOUT:-}

        # Enterprise Edition only
        - NEXT_PUBLIC_THEME=${NEXT_PUBLIC_THEME:-}
        - NEXT_PUBLIC_DO_NOT_USE_TOGGLE_OFF_DANSWER_POWERED=${NEXT_PUBLIC_DO_NOT_USE_TOGGLE_OFF_DANSWER_POWERED:-true}
    depends_on:
      - api_server
    restart: unless-stopped
    environment:
      - INTERNAL_URL=http://api_server:8080
      - WEB_DOMAIN=${WEB_DOMAIN:-}
      - THEME_IS_DARK=${THEME_IS_DARK:-}

      # Enterprise Edition only

  # ---------------------------------------------------------------------------
  # Cortex embeddings: generic OpenAI-compatible /v1/embeddings endpoint.
  # Cortex (see ../../cortex) replaces the former bespoke inference/indexing model servers. Exactly ONE of
  # the two profiles below should be active (add it to COMPOSE_PROFILES in .env);
  # both answer on the network alias `cortex_embed` (legacy alias `embedding_server`) port 8000, so the backend
  # never changes:
  #   Admin > Embedding > provider "LiteLLM", API URL
  #   http://cortex_embed:8000/v1/embeddings, model name = ${EMBEDDING_MODEL}
  # One process serves ONE model; to host another model, copy the block with a
  # different alias/model, or put a gateway (LiteLLM proxy / nginx) in front.
  # ---------------------------------------------------------------------------
  cortex_embed_vllm:
    build:
      context: ../../cortex
      args:
        - VLLM_IMAGE=${VLLM_IMAGE:-vllm/vllm-openai:latest}
    image: om/cortex:local
    profiles: ["vllm"]
    environment:
      - CORTEX_MODEL=${EMBEDDING_MODEL:-nomic-ai/nomic-embed-text-v1}
      - CORTEX_MAX_LEN=${EMBEDDING_MAX_LEN:-2048}
      - CORTEX_GPU_UTIL=${EMBEDDING_GPU_UTIL:-0.25}
      - CORTEX_API_KEY=${EMBEDDING_API_KEY:-}
      # nomic-embed-text-v1 ships custom modelling code
      - CORTEX_TRUST_REMOTE_CODE=${EMBEDDING_TRUST_REMOTE_CODE:-true}
      # Scheduler limits sized for a small GPU; keep >= EMBEDDING_BATCH_SIZE
      - CORTEX_EXTRA_ARGS=${EMBEDDING_EXTRA_ARGS:---max-num-seqs 64 --max-num-batched-tokens 16384}
      # Needed for gated models such as google/embeddinggemma-300m
      - HF_TOKEN=${HF_TOKEN:-}
      - HUGGING_FACE_HUB_TOKEN=${HF_TOKEN:-}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    volumes:
      - cortex_hf_cache:/root/.cache/huggingface
    networks:
      default:
        aliases:
          - cortex_embed
          - embedding_server
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "6"

  cortex_embed_tei:
    # Hugging Face Text Embeddings Inference. `86-` tag = Ampere (RTX 30xx);
    # use the `cpu-` tag for CPU-only hosts, `89-` for Ada, etc.
    image: ${TEI_IMAGE:-ghcr.io/huggingface/text-embeddings-inference:86-1.8}
    profiles: ["tei"]
    command: >
      --model-id ${EMBEDDING_MODEL:-nomic-ai/nomic-embed-text-v1}
      --port 8000
      --max-client-batch-size ${EMBEDDING_MAX_BATCH:-64}
    environment:
      - HF_TOKEN=${HF_TOKEN:-}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    volumes:
      - cortex_hf_cache:/data
    networks:
      default:
        aliases:
          - cortex_embed
          - embedding_server
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "6"

  # Cortex reranker: cross-encoder served on /v1/rerank. Off by default (profile "rerank").
  # Turn reranking on in the backend with RERANK_ENABLED=true (see cortex/README.md).
  cortex_rerank_vllm:
    build:
      context: ../../cortex
      args:
        - VLLM_IMAGE=${VLLM_IMAGE:-vllm/vllm-openai:latest}
    image: om/cortex:local
    profiles: ["rerank"]
    environment:
      - CORTEX_MODEL=${RERANK_MODEL:-BAAI/bge-reranker-v2-m3}
      - CORTEX_MAX_LEN=${RERANK_MAX_LEN:-1024}
      - CORTEX_GPU_UTIL=${RERANK_GPU_UTIL:-0.30}
      - CORTEX_API_KEY=${RERANK_API_KEY:-}
      - CORTEX_TRUST_REMOTE_CODE=${RERANK_TRUST_REMOTE_CODE:-false}
      - CORTEX_EXTRA_ARGS=${RERANK_EXTRA_ARGS:-}
      - HF_TOKEN=${HF_TOKEN:-}
      - HUGGING_FACE_HUB_TOKEN=${HF_TOKEN:-}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    volumes:
      - cortex_hf_cache:/root/.cache/huggingface
    networks:
      default:
        aliases:
          - cortex_rerank
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "6"

  relational_db:
    image: postgres:15.2-alpine
    shm_size: 1g
    command: -c 'max_connections=250'
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-password}
      - DB_READONLY_USER=${DB_READONLY_USER:-}
      - DB_READONLY_PASSWORD=${DB_READONLY_PASSWORD:-}
    ports:
      - "5432"
    volumes:
      - db_volume:/var/lib/postgresql/data

  # OpenSearch is the document index (the only search engine).
  opensearch:
    image: opensearchproject/opensearch:${OPENSEARCH_IMAGE_TAG:-3.6.0}
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      # single-node so OpenSearch doesn't wait to form a cluster
      - discovery.type=single-node
      # OpenSearch 2.12+ requires a STRONG initial admin password
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=${OPENSEARCH_ADMIN_PASSWORD:-StrongPassword123!}
      - bootstrap.memory_lock=true
      # Heap should be ~50% of the container memory limit; Xms must equal Xmx
      - "OPENSEARCH_JAVA_OPTS=${OPENSEARCH_JAVA_OPTS:--Xms2g -Xmx2g}"
    ports:
      - "9200:9200"
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -skf https://localhost:9200 -u admin:${OPENSEARCH_ADMIN_PASSWORD:-StrongPassword123!}",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "6"

  nginx:
    image: nginx:1.25.5-alpine
    restart: unless-stopped
    # nginx will immediately crash with `nginx: [emerg] host not found in upstream`
    # if api_server / web_server are not up
    depends_on:
      - api_server
      - web_server
    environment:
      - DOMAIN=localhost
    ports:
      - "${NGINX_PORT:-3000}:80" # allow for localhost:3000 usage, since that is the norm
    volumes:
      - ../data/nginx:/etc/nginx/conf.d
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "6"
    # The specified script waits for the api_server to start up.
    # Without this we've seen issues where nginx shows no error logs but
    # does not recieve any traffic
    # NOTE: we have to use dos2unix to remove Carriage Return chars from the file
    # in order to make this work on both Unix-like systems and windows
    command: >
      /bin/sh -c "dos2unix /etc/nginx/conf.d/run-nginx.sh
      && /etc/nginx/conf.d/run-nginx.sh app.conf.template"

  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z-cpuv1
    restart: unless-stopped
    ports:
      - "9004:9000"
      - "9005:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_DEFAULT_BUCKETS: ${S3_FILE_STORE_BUCKET_NAME:-onyx-file-store-bucket}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  cache:
    image: redis:7.4-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    # docker silently mounts /data even without an explicit volume mount, which enables
    # persistence. explicitly setting save and appendonly forces ephemeral behavior.
    command: redis-server --save "" --appendonly no
    # Use tmpfs to prevent creation of anonymous volumes for /data
    tmpfs:
      - /data

volumes:
  cortex_hf_cache:
  db_volume:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DANSWER_POSTGRES_DATA_DIR:-./postgres_data}
  opensearch_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DANSWER_OPENSEARCH_DATA_DIR:-./opensearch_data}
  log_store: # for logs that we don't want to lose on container restarts
  minio_data:
