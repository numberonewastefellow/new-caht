# =============================================================================
# ONYX DOCKER COMPOSE
# =============================================================================
# This is the default configuration for VertualAI. This file is fairly configurable,
# also see env.template for possible settings.
#
# PRODUCTION DEPLOYMENT CHECKLIST:
# To convert this setup to a production deployment following best practices,
# follow the checklist below. Note that there are other ways to secure the VertualAI
# deployment so these are not strictly necessary for all teams.
#
# 1. SECURITY HARDENING:
#    - Remove all port exposures except nginx (80/443)
#    - Comment out ports for: api_server, relational_db, index, cache, minio
#
# 2. SSL/TLS SETUP:
#    - Uncomment the certbot service (see below)
#    - Add SSL certificate volumes to nginx service
#    - Change nginx command from app.conf.template to app.conf.template.prod
#
# 3. ENVIRONMENT CONFIGURATION:
#    - Replace env_file with explicit environment variables
#
# 4. AUTHENTICATION:
#    - Select an authentication method like Basic, Google OAuth, OIDC, or SAML
#
# 5. CA CERTIFICATES:
#    - Uncomment custom CA certificate volumes if needed
#
# 6. DOMAIN CONFIGURATION:
#    - Set proper DOMAIN environment variable for nginx
#    - Configure DNS and SSL certificates
#
# For a complete production setup, refer to docker-compose.prod.yml
# =============================================================================

name: virtualai

services:
  api_server:
    image: ${OM_BACKEND_IMAGE:-om/om-backend:${IMAGE_TAG:-latest}}
    build:
      context: ../../backend
      dockerfile: Dockerfile
      args:
        - ENABLE_CRAFT=${ENABLE_CRAFT:-false}
        - PREBAKE_CRAFT_TEMPLATES=${PREBAKE_CRAFT_TEMPLATES:-true}
    command: >
      /bin/sh -c "alembic upgrade head &&
      echo \"Starting VertualAI Api Server\" &&
      uvicorn om.main:app --host 0.0.0.0 --port 8080"
    # Check env.template and copy to .env for env vars
    env_file:
      - path: .env
        required: false
    depends_on:
      relational_db:
        condition: service_started
      # NOTE: OpenSearch is intentionally NOT a hard dependency; the backend
      # retries the search-index connection on startup.
      cache:
        condition: service_started
      minio:
        condition: service_started
        required: false
    restart: unless-stopped
    # DEV: To expose ports, either:
    # 1. Use docker-compose.dev.yml: docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --wait
    # 2. Uncomment the ports below
    # ports:
    #   - "8080:8080"
    environment:
      # Auth Settings
      - AUTH_TYPE=${AUTH_TYPE:-basic}
      - FILE_STORE_BACKEND=${FILE_STORE_BACKEND:-s3}
      # Arize Phoenix LLM Observability
      - PHOENIX_COLLECTOR_ENDPOINT=${PHOENIX_COLLECTOR_ENDPOINT:-}
      - POSTGRES_HOST=${POSTGRES_HOST:-relational_db}
      # OpenSearch is the only document index.
      - OPENSEARCH_HOST=${OPENSEARCH_HOST:-opensearch}
      - OPENSEARCH_ADMIN_PASSWORD=${OPENSEARCH_ADMIN_PASSWORD:-StrongPassword123!}
      - OPENSEARCH_USE_SSL=${OPENSEARCH_USE_SSL:-true}
      - REDIS_HOST=${REDIS_HOST:-cache}
      # On startup the backend points the embedding settings at this server
      # (only if the served model matches the current one, see setup.py).
      - EMBEDDING_SERVER_URL=${EMBEDDING_SERVER_URL:-http://cortex_embed:8000/v1/embeddings}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-nomic-ai/nomic-embed-text-v1}
      - EMBEDDING_API_KEY=${EMBEDDING_API_KEY:-}
      # Texts per /v1/embeddings request (backend default is 512, too big for a small GPU)
      - EMBEDDING_BATCH_SIZE=${EMBEDDING_BATCH_SIZE:-64}
      - RERANK_ENABLED=${RERANK_ENABLED:-false}
      - RERANK_SERVER_URL=${RERANK_SERVER_URL:-http://cortex_rerank:8000/v1/rerank}
      - RERANK_MODEL=${RERANK_MODEL:-BAAI/bge-reranker-v2-m3}
      - RERANK_API_KEY=${RERANK_API_KEY:-}
      - RERANK_TOP_N=${RERANK_TOP_N:-20}
      - RERANK_PROTECT_TOP_K=${RERANK_PROTECT_TOP_K:-2}
      - S3_ENDPOINT_URL=${S3_ENDPOINT_URL:-http://minio:9000}
      - S3_AWS_ACCESS_KEY_ID=${S3_AWS_ACCESS_KEY_ID:-minioadmin}
      - S3_AWS_SECRET_ACCESS_KEY=${S3_AWS_SECRET_ACCESS_KEY:-minioadmin}
      # VertualAI Craft configuration (disabled by default, set ENABLE_CRAFT=true in .env to enable)
      # Use --include-craft with install script, or manually set in .env file
      - ENABLE_CRAFT=${ENABLE_CRAFT:-false}
      - OUTPUTS_TEMPLATE_PATH=${OUTPUTS_TEMPLATE_PATH:-/app/om/server/features/build/sandbox/kubernetes/docker/templates/outputs}
      - VENV_TEMPLATE_PATH=${VENV_TEMPLATE_PATH:-/app/om/server/features/build/sandbox/kubernetes/docker/templates/venv}
      - WEB_TEMPLATE_PATH=${WEB_TEMPLATE_PATH:-/app/om/server/features/build/sandbox/kubernetes/docker/templates/outputs/web}
      - PERSISTENT_DOCUMENT_STORAGE_PATH=${PERSISTENT_DOCUMENT_STORAGE_PATH:-/app/file-system}
    # PRODUCTION: Uncomment the line below to use if IAM_AUTH is true and you are using iam auth for postgres
    # volumes:
    #   - ./bundle.pem:/app/bundle.pem:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "6"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8080/heartbeat')",
        ]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 25s
    # Optional, only for debugging purposes
    volumes:
      - api_server_logs:/var/log/om
      # Shared volume for persistent document storage (Craft file-system mode)
      - file-system:/app/file-system
      # Shared Craft templates volume (venv + npm deps, persisted across restarts)
      - craft-templates:/app/om/server/features/build/sandbox/kubernetes/docker/templates

  background:
    image: ${OM_BACKEND_IMAGE:-om/om-backend:${IMAGE_TAG:-latest}}
    build:
      context: ../../backend
      dockerfile: Dockerfile
      args:
        - ENABLE_CRAFT=${ENABLE_CRAFT:-false}
        - PREBAKE_CRAFT_TEMPLATES=${PREBAKE_CRAFT_TEMPLATES:-true}
    command: >
      /bin/sh -c "
      if [ -f /app/scripts/setup_craft_templates.sh ]; then
        /app/scripts/setup_craft_templates.sh;
      fi &&
      if [ -f /etc/ssl/certs/custom-ca.crt ]; then
        update-ca-certificates;
      fi &&
      /app/scripts/supervisord_entrypoint.sh"
    env_file:
      - path: .env
        required: false
    depends_on:
      # OpenSearch is intentionally omitted as a hard dependency (backend retries).
      - relational_db
      - cache
    restart: unless-stopped
    environment:
      - USE_LIGHTWEIGHT_BACKGROUND_WORKER=${USE_LIGHTWEIGHT_BACKGROUND_WORKER:-true}
      - FILE_STORE_BACKEND=${FILE_STORE_BACKEND:-s3}
      # Arize Phoenix LLM Observability
      - PHOENIX_COLLECTOR_ENDPOINT=${PHOENIX_COLLECTOR_ENDPOINT:-}
      - POSTGRES_HOST=${POSTGRES_HOST:-relational_db}
      # OpenSearch is the only document index.
      - OPENSEARCH_HOST=${OPENSEARCH_HOST:-opensearch}
      - OPENSEARCH_ADMIN_PASSWORD=${OPENSEARCH_ADMIN_PASSWORD:-StrongPassword123!}
      - OPENSEARCH_USE_SSL=${OPENSEARCH_USE_SSL:-true}
      - REDIS_HOST=${REDIS_HOST:-cache}
      # On startup the backend points the embedding settings at this server
      # (only if the served model matches the current one, see setup.py).
      - EMBEDDING_SERVER_URL=${EMBEDDING_SERVER_URL:-http://cortex_embed:8000/v1/embeddings}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-nomic-ai/nomic-embed-text-v1}
      - EMBEDDING_API_KEY=${EMBEDDING_API_KEY:-}
      # Texts per /v1/embeddings request (backend default is 512, too big for a small GPU)
      - EMBEDDING_BATCH_SIZE=${EMBEDDING_BATCH_SIZE:-64}
      - RERANK_ENABLED=${RERANK_ENABLED:-false}
      - RERANK_SERVER_URL=${RERANK_SERVER_URL:-http://cortex_rerank:8000/v1/rerank}
      - RERANK_MODEL=${RERANK_MODEL:-BAAI/bge-reranker-v2-m3}
      - RERANK_API_KEY=${RERANK_API_KEY:-}
      - RERANK_TOP_N=${RERANK_TOP_N:-20}
      - RERANK_PROTECT_TOP_K=${RERANK_PROTECT_TOP_K:-2}
      - S3_ENDPOINT_URL=${S3_ENDPOINT_URL:-http://minio:9000}
      - S3_AWS_ACCESS_KEY_ID=${S3_AWS_ACCESS_KEY_ID:-minioadmin}
      - S3_AWS_SECRET_ACCESS_KEY=${S3_AWS_SECRET_ACCESS_KEY:-minioadmin}
      - DISCORD_BOT_TOKEN=${DISCORD_BOT_TOKEN:-}
      - DISCORD_BOT_INVOKE_CHAR=${DISCORD_BOT_INVOKE_CHAR:-!}
      # API Server connection for Discord bot message processing
      - API_SERVER_PROTOCOL=${API_SERVER_PROTOCOL:-http}
      - API_SERVER_HOST=${API_SERVER_HOST:-api_server}
      # VertualAI Craft configuration (set up automatically on container startup)
      - ENABLE_CRAFT=${ENABLE_CRAFT:-false}
      - OUTPUTS_TEMPLATE_PATH=${OUTPUTS_TEMPLATE_PATH:-/app/om/server/features/build/sandbox/kubernetes/docker/templates/outputs}
      - VENV_TEMPLATE_PATH=${VENV_TEMPLATE_PATH:-/app/om/server/features/build/sandbox/kubernetes/docker/templates/venv}
      - WEB_TEMPLATE_PATH=${WEB_TEMPLATE_PATH:-/app/om/server/features/build/sandbox/kubernetes/docker/templates/outputs/web}
      - PERSISTENT_DOCUMENT_STORAGE_PATH=${PERSISTENT_DOCUMENT_STORAGE_PATH:-/app/file-system}
    # PRODUCTION: Uncomment the line below to use if IAM_AUTH is true and you are using iam auth for postgres
    # volumes:
    #   - ./bundle.pem:/app/bundle.pem:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Optional, only for debugging purposes
    volumes:
      - background_logs:/var/log/om
      # Shared volume for persistent document storage (Craft file-system mode)
      - file-system:/app/file-system
      # Shared Craft templates volume (venv + npm deps, persisted across restarts)
      - craft-templates:/app/om/server/features/build/sandbox/kubernetes/docker/templates
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "6"
    # PRODUCTION: Uncomment the following lines if you need to include a custom CA certificate
    # This section enables the use of a custom CA certificate
    # If present, the custom CA certificate is mounted as a volume
    # The container checks for its existence and updates the system's CA certificates
    # This allows for secure communication with services using custom SSL certificates
    # Optional volume mount for CA certificate
    # volumes:
    #   # Maps to the CA_CERT_PATH environment variable in the Dockerfile
    #   - ${CA_CERT_PATH:-./custom-ca.crt}:/etc/ssl/certs/custom-ca.crt:ro

  # ---------------------------------------------------------------------------
  # Pulse — scheduled workflow engine (like Cortex for inference, Pulse is the
  # brand for scheduling). Image = backend image + Pulse layer (Dockerfile.pulse).
  #   pulse_scheduler: HA ticker; 2 replicas by default — row locks + an advisory
  #                    lock make extra replicas safe (no double-fire, no SPOF).
  #   pulse_worker:    executes runs from the `pulse` queue; scale with
  #                    `docker compose up -d --scale pulse_worker=N`.
  # Docs: docs/scheduled-workflows/OPERATIONS.md
  # ---------------------------------------------------------------------------
  pulse_scheduler:
    image: ${OM_PULSE_IMAGE:-om/pulse:${IMAGE_TAG:-latest}}
    build:
      context: ../../backend
      dockerfile: Dockerfile.pulse
      args:
        - OM_BACKEND_IMAGE=${OM_BACKEND_IMAGE:-om/om-backend:${IMAGE_TAG:-latest}}
    command: ["scheduler"]
    env_file:
      - path: .env
        required: false
    depends_on:
      - relational_db
      - cache
      # api_server applies the DB migrations Pulse needs on startup
      - api_server
    restart: unless-stopped
    deploy:
      replicas: ${PULSE_SCHEDULER_REPLICAS:-2}
    environment:
      - PULSE_ROLE=scheduler
      - PULSE_TICK_SECONDS=${PULSE_TICK_SECONDS:-5}
      - PULSE_TENANT_MAX_CONCURRENT_RUNS=${PULSE_TENANT_MAX_CONCURRENT_RUNS:-8}
      - PULSE_MISFIRE_GRACE_SECONDS=${PULSE_MISFIRE_GRACE_SECONDS:-300}
      - PULSE_MAX_CONSECUTIVE_FAILURES=${PULSE_MAX_CONSECUTIVE_FAILURES:-5}
      - PULSE_RUN_HISTORY_DAYS=${PULSE_RUN_HISTORY_DAYS:-90}
      # The scheduler only needs Postgres + Redis (no file store / LLM / search access)
      - POSTGRES_HOST=${POSTGRES_HOST:-relational_db}
      - REDIS_HOST=${REDIS_HOST:-cache}
    volumes:
      - pulse_logs:/var/log/om
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  pulse_worker:
    image: ${OM_PULSE_IMAGE:-om/pulse:${IMAGE_TAG:-latest}}
    build:
      context: ../../backend
      dockerfile: Dockerfile.pulse
      args:
        - OM_BACKEND_IMAGE=${OM_BACKEND_IMAGE:-om/om-backend:${IMAGE_TAG:-latest}}
    command: ["worker"]
    env_file:
      - path: .env
        required: false
    depends_on:
      - relational_db
      - cache
      - api_server
    restart: unless-stopped
    # Warm shutdown lets in-flight runs finish: must exceed the longest workflow
    # timeout (default 1800s) + PULSE_DEADLINE_MARGIN_SECONDS.
    stop_grace_period: 1900s
    environment:
      - PULSE_ROLE=worker
      - PULSE_WORKER_CONCURRENCY=${PULSE_WORKER_CONCURRENCY:-4}
      - PULSE_MAX_CONSECUTIVE_FAILURES=${PULSE_MAX_CONSECUTIVE_FAILURES:-5}
      - PULSE_MISFIRE_GRACE_SECONDS=${PULSE_MISFIRE_GRACE_SECONDS:-300}
      - FILE_STORE_BACKEND=${FILE_STORE_BACKEND:-s3}
      - PHOENIX_COLLECTOR_ENDPOINT=${PHOENIX_COLLECTOR_ENDPOINT:-}
      - POSTGRES_HOST=${POSTGRES_HOST:-relational_db}
      - OPENSEARCH_HOST=${OPENSEARCH_HOST:-opensearch}
      - OPENSEARCH_ADMIN_PASSWORD=${OPENSEARCH_ADMIN_PASSWORD:-StrongPassword123!}
      - OPENSEARCH_USE_SSL=${OPENSEARCH_USE_SSL:-true}
      - REDIS_HOST=${REDIS_HOST:-cache}
      - EMBEDDING_SERVER_URL=${EMBEDDING_SERVER_URL:-http://cortex_embed:8000/v1/embeddings}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-nomic-ai/nomic-embed-text-v1}
      - EMBEDDING_API_KEY=${EMBEDDING_API_KEY:-}
      - EMBEDDING_BATCH_SIZE=${EMBEDDING_BATCH_SIZE:-64}
      - RERANK_ENABLED=${RERANK_ENABLED:-false}
      - RERANK_SERVER_URL=${RERANK_SERVER_URL:-http://cortex_rerank:8000/v1/rerank}
      - RERANK_MODEL=${RERANK_MODEL:-BAAI/bge-reranker-v2-m3}
      - RERANK_API_KEY=${RERANK_API_KEY:-}
      - RERANK_TOP_N=${RERANK_TOP_N:-20}
      - RERANK_PROTECT_TOP_K=${RERANK_PROTECT_TOP_K:-2}
      - S3_ENDPOINT_URL=${S3_ENDPOINT_URL:-http://minio:9000}
      - S3_AWS_ACCESS_KEY_ID=${S3_AWS_ACCESS_KEY_ID:-minioadmin}
      - S3_AWS_SECRET_ACCESS_KEY=${S3_AWS_SECRET_ACCESS_KEY:-minioadmin}
      # Workflows that use the Python tool need the code interpreter
      - CODE_INTERPRETER_BASE_URL=${CODE_INTERPRETER_BASE_URL:-http://code-interpreter:8000}
      - PERSISTENT_DOCUMENT_STORAGE_PATH=${PERSISTENT_DOCUMENT_STORAGE_PATH:-/app/file-system}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - pulse_logs:/var/log/om
      - file-system:/app/file-system
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "6"
    # PRODUCTION: same optional custom-CA mount as `background`
    # volumes:
    #   # Maps to the CA_CERT_PATH environment variable in the Dockerfile
    #   - ${CA_CERT_PATH:-./custom-ca.crt}:/etc/ssl/certs/custom-ca.crt:ro

  web_server:
    image: ${OM_WEB_SERVER_IMAGE:-om/om-web-server:${IMAGE_TAG:-latest}}
    build:
      context: ../../web
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_DISABLE_LOGOUT=${NEXT_PUBLIC_DISABLE_LOGOUT:-}
        - NEXT_PUBLIC_FORGOT_PASSWORD_ENABLED=${NEXT_PUBLIC_FORGOT_PASSWORD_ENABLED:-}
        # Enterprise Edition only
        - NEXT_PUBLIC_THEME=${NEXT_PUBLIC_THEME:-}
        - NEXT_PUBLIC_DO_NOT_USE_TOGGLE_OFF_DANSWER_POWERED=${NEXT_PUBLIC_DO_NOT_USE_TOGGLE_OFF_DANSWER_POWERED:-true}
        - NODE_OPTIONS=${NODE_OPTIONS:-"--max-old-space-size=4096"}
    env_file:
      - path: .env
        required: false
    depends_on:
      - api_server
    restart: unless-stopped
    environment:
      - INTERNAL_URL=${INTERNAL_URL:-http://api_server:8080}
      # Default UI version for dual-version pages (e.g. the Agentic AI page).
      # Plain (NON-NEXT_PUBLIC_) var read at runtime by the Next server layout,
      # so changing it only needs a container restart, not a rebuild.
      # Values: "new" (default) | "legacy". Per-user override via the in-app
      # toggle / ?legacy=1. See AGENTIC_AI_REBRAND_PLAN.md.
      - DEFAULT_UI_VERSION=${DEFAULT_UI_VERSION:-new}

  # Uncomment the block below to enable the MCP server for VertualAI.
  # mcp_server:
  #   image: ${OM_BACKEND_IMAGE:-om/om-backend:${IMAGE_TAG:-latest}}
  #   build:
  #     context: ../../backend
  #     dockerfile: Dockerfile
  #   command: >
  #     /bin/sh -c "if [ \"${MCP_SERVER_ENABLED:-}\" != \"True\" ] && [ \"${MCP_SERVER_ENABLED:-}\" != \"true\" ]; then
  #       echo 'MCP server is disabled (MCP_SERVER_ENABLED=false), skipping...';
  #       exit 0;
  #     else
  #       exec python -m om.mcp_server_main;
  #     fi"
  #   env_file:
  #     - path: .env
  #       required: false
  #   depends_on:
  #     - relational_db
  #     - cache
  #   restart: "no"
  #   environment:
  #     - POSTGRES_HOST=${POSTGRES_HOST:-relational_db}
  #     - REDIS_HOST=${REDIS_HOST:-cache}
  #     # MCP Server Configuration
  #     - MCP_SERVER_ENABLED=${MCP_SERVER_ENABLED:-false}
  #     - MCP_SERVER_PORT=${MCP_SERVER_PORT:-8090}
  #     - MCP_SERVER_CORS_ORIGINS=${MCP_SERVER_CORS_ORIGINS:-}
  #     - API_SERVER_PROTOCOL=${API_SERVER_PROTOCOL:-http}
  #     - API_SERVER_HOST=${API_SERVER_HOST:-api_server}
  #   extra_hosts:
  #     - "host.docker.internal:host-gateway"
  #   logging:
  #     driver: json-file
  #     options:
  #       max-size: "50m"
  #       max-file: "6"
  #   # Optional, only for debugging purposes
  #   volumes:
  #     - mcp_server_logs:/var/log/om

  # ---------------------------------------------------------------------------
  # Cortex embeddings: generic OpenAI-compatible /v1/embeddings endpoint.
  # Cortex (see ../../cortex) replaces the former bespoke inference/indexing model servers. Exactly ONE of
  # the two profiles below should be active (add it to COMPOSE_PROFILES in .env);
  # both answer on the network alias `cortex_embed` (legacy alias `embedding_server`) port 8000, so the backend
  # never changes:
  #   Admin > Embedding > provider "LiteLLM", API URL
  #   http://cortex_embed:8000/v1/embeddings, model name = ${EMBEDDING_MODEL}
  # One process serves ONE model; to host another model, copy the block with a
  # different alias/model, or put a gateway (LiteLLM proxy / nginx) in front.
  # ---------------------------------------------------------------------------
  cortex_embed_vllm:
    build:
      context: ../../cortex
      args:
        - VLLM_IMAGE=${VLLM_IMAGE:-vllm/vllm-openai:latest}
    image: om/cortex:local
    profiles: ["vllm"]
    environment:
      - CORTEX_MODEL=${EMBEDDING_MODEL:-nomic-ai/nomic-embed-text-v1}
      - CORTEX_MAX_LEN=${EMBEDDING_MAX_LEN:-2048}
      - CORTEX_GPU_UTIL=${EMBEDDING_GPU_UTIL:-0.25}
      - CORTEX_API_KEY=${EMBEDDING_API_KEY:-}
      # nomic-embed-text-v1 ships custom modelling code
      - CORTEX_TRUST_REMOTE_CODE=${EMBEDDING_TRUST_REMOTE_CODE:-true}
      # Scheduler limits sized for a small GPU; keep >= EMBEDDING_BATCH_SIZE
      - CORTEX_EXTRA_ARGS=${EMBEDDING_EXTRA_ARGS:---max-num-seqs 64 --max-num-batched-tokens 16384}
      # Needed for gated models such as google/embeddinggemma-300m
      - HF_TOKEN=${HF_TOKEN:-}
      - HUGGING_FACE_HUB_TOKEN=${HF_TOKEN:-}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    volumes:
      - cortex_hf_cache:/root/.cache/huggingface
    networks:
      default:
        aliases:
          - cortex_embed
          - embedding_server
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "6"

  cortex_embed_tei:
    # Hugging Face Text Embeddings Inference. `86-` tag = Ampere (RTX 30xx);
    # use the `cpu-` tag for CPU-only hosts, `89-` for Ada, etc.
    image: ${TEI_IMAGE:-ghcr.io/huggingface/text-embeddings-inference:86-1.8}
    profiles: ["tei"]
    command: >
      --model-id ${EMBEDDING_MODEL:-nomic-ai/nomic-embed-text-v1}
      --port 8000
      --max-client-batch-size ${EMBEDDING_MAX_BATCH:-64}
    environment:
      - HF_TOKEN=${HF_TOKEN:-}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    volumes:
      - cortex_hf_cache:/data
    networks:
      default:
        aliases:
          - cortex_embed
          - embedding_server
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "6"

  # Cortex reranker: cross-encoder served on /v1/rerank. Off by default (profile "rerank").
  # Turn reranking on in the backend with RERANK_ENABLED=true (see cortex/README.md).
  cortex_rerank_vllm:
    build:
      context: ../../cortex
      args:
        - VLLM_IMAGE=${VLLM_IMAGE:-vllm/vllm-openai:latest}
    image: om/cortex:local
    profiles: ["rerank"]
    environment:
      - CORTEX_MODEL=${RERANK_MODEL:-BAAI/bge-reranker-v2-m3}
      - CORTEX_MAX_LEN=${RERANK_MAX_LEN:-1024}
      - CORTEX_GPU_UTIL=${RERANK_GPU_UTIL:-0.30}
      - CORTEX_API_KEY=${RERANK_API_KEY:-}
      - CORTEX_TRUST_REMOTE_CODE=${RERANK_TRUST_REMOTE_CODE:-false}
      - CORTEX_EXTRA_ARGS=${RERANK_EXTRA_ARGS:-}
      - HF_TOKEN=${HF_TOKEN:-}
      - HUGGING_FACE_HUB_TOKEN=${HF_TOKEN:-}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    volumes:
      - cortex_hf_cache:/root/.cache/huggingface
    networks:
      default:
        aliases:
          - cortex_rerank
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "6"

  relational_db:
    image: postgres:15.2-alpine
    shm_size: 1g
    command: -c 'max_connections=250'
    env_file:
      - path: .env
        required: false
    restart: unless-stopped
    # PRODUCTION: Override the defaults by passing in the environment variables
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-password}
    # DEV: To expose ports, either:
    # 1. Use docker-compose.dev.yml: docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --wait
    # 2. Uncomment the ports below
    # ports:
    #   - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - db_volume:/var/lib/postgresql/data

  # OpenSearch is the document index (the only search engine).
  opensearch:
    image: opensearchproject/opensearch:${OPENSEARCH_IMAGE_TAG:-3.6.0}
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      # single-node so OpenSearch doesn't wait to form a cluster
      - discovery.type=single-node
      # OpenSearch 2.12+ requires a STRONG initial admin password
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=${OPENSEARCH_ADMIN_PASSWORD:-StrongPassword123!}
      - bootstrap.memory_lock=true
      # Heap should be ~50% of the container memory limit; Xms must equal Xmx
      - "OPENSEARCH_JAVA_OPTS=${OPENSEARCH_JAVA_OPTS:--Xms2g -Xmx2g}"
    ports:
      - "9200:9200"
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -skf https://localhost:9200 -u admin:${OPENSEARCH_ADMIN_PASSWORD:-StrongPassword123!}",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "6"

  nginx:
    image: nginx:1.25.5-alpine
    restart: unless-stopped
    # nginx will immediately crash with `nginx: [emerg] host not found in upstream`
    # if api_server / web_server are not up
    depends_on:
      - api_server
      - web_server
    env_file:
      - path: .env
        required: false
    environment:
      - DOMAIN=localhost
      # Nginx proxy timeout settings (in seconds)
      - NGINX_PROXY_CONNECT_TIMEOUT=${NGINX_PROXY_CONNECT_TIMEOUT:-300}
      - NGINX_PROXY_SEND_TIMEOUT=${NGINX_PROXY_SEND_TIMEOUT:-300}
      - NGINX_PROXY_READ_TIMEOUT=${NGINX_PROXY_READ_TIMEOUT:-300}
      - PHOENIX_ENABLED=${PHOENIX_ENABLED:-false}
    ports:
      - "${HOST_PORT_80:-80}:80"
      - "${HOST_PORT:-3000}:80" # allow for localhost:3000 usage, since that is the norm
    volumes:
      - ../data/nginx:/etc/nginx/conf.d
    # PRODUCTION: Add SSL certificate volumes for HTTPS support:
    #   - ../data/certbot/conf:/etc/letsencrypt
    #   - ../data/certbot/www:/var/www/certbot
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "6"
    # The specified script waits for the api_server to start up.
    # Without this we've seen issues where nginx shows no error logs but
    # does not receive any traffic
    # NOTE: we have to use dos2unix to remove Carriage Return chars from the file
    # in order to make this work on both Unix-like systems and windows
    # PRODUCTION: Change to app.conf.template.prod for production nginx config
    command: >
      /bin/sh -c "dos2unix /etc/nginx/conf.d/run-nginx.sh
      && /etc/nginx/conf.d/run-nginx.sh app.conf.template"

  cache:
    image: redis:7.4-alpine
    restart: unless-stopped
    # DEV: To expose ports, either:
    # 1. Use docker-compose.dev.yml: docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --wait
    # 2. Uncomment the ports below
    # ports:
    #   - "6379:6379"
    # docker silently mounts /data even without an explicit volume mount, which enables
    # persistence. explicitly setting save and appendonly forces ephemeral behavior.
    command: redis-server --save "" --appendonly no
    env_file:
      - path: .env
        required: false
    # Use tmpfs to prevent creation of anonymous volumes for /data
    tmpfs:
      - /data

  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z-cpuv1
    profiles: ["s3-filestore"]
    restart: unless-stopped
    # DEV: To expose ports, either:
    # 1. Use docker-compose.dev.yml: docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --wait
    # 2. Uncomment the ports below
    # ports:
    #   - "9004:9000"
    #   - "9005:9001"
    env_file:
      - path: .env
        required: false
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      # Note: we've seen the default bucket creation logic not work in some cases
      MINIO_DEFAULT_BUCKETS: ${S3_FILE_STORE_BUCKET_NAME:-onyx-file-store-bucket}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  code-interpreter:
    build:
      context: ../../code-interpreter/code-interpreter
      dockerfile: Dockerfile
    image: om/code-interpreter:local
    entrypoint: ["/bin/bash", "-c"]
    command: >
      "
      if [ \"$${CODE_INTERPRETER_BETA_ENABLED}\" = \"True\" ] || [ \"$${CODE_INTERPRETER_BETA_ENABLED}\" = \"true\" ]; then
        exec bash ./entrypoint.sh code-interpreter-api;
      else
        echo 'Skipping code interpreter';
        exec tail -f /dev/null;
      fi
      "
    restart: unless-stopped
    env_file:
      - path: .env
        required: false

    # Below is needed for the `docker-out-of-docker` execution mode
    user: root
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

    # uncomment below + comment out the above to use the `docker-in-docker` execution mode
    # privileged: true

  # Arize Phoenix — LLM Observability & Evaluation (port 6006)
  # Receives OpenTelemetry traces from the backend. Set PHOENIX_ENABLED=true in .env to activate.
  # Dashboard: accessible at /phoenix/ via nginx proxy
  phoenix:
    build:
      context: ../../phoenix
      dockerfile: Dockerfile
    image: virtualai-phoenix:13.11.0
    container_name: phoenix
    # ports:
    #   - "6006:6006"
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    user: "0:0"
    environment:
      - PHOENIX_WORKING_DIR=/phoenix_data
      - PHOENIX_HOST_ROOT_PATH=/phoenix
    volumes:
      - phoenix_data:/phoenix_data
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "6"

  # PRODUCTION: Uncomment the following certbot service for SSL certificate management
  # certbot:
  #   image: certbot/certbot
  #   restart: unless-stopped
  #   volumes:
  #     - ../data/certbot/conf:/etc/letsencrypt
  #     - ../data/certbot/www:/var/www/certbot
  #   logging:
  #     driver: json-file
  #     options:
  #       max-size: "50m"
  #       max-file: "6"
  #   entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

  # SmartSearch AI (Perplexica) — AI-powered web search with cited sources
  # Configure in Admin > Web Search > SmartSearch AI with base URL: http://smartsearch:3000
  # Build from local source: ../../Perplexica (repo root/Perplexica)
  # Bundles SearxNG internally (port 8080) + Perplexica Next.js app (port 3000)
  smartsearch:
    image: ${SMARTSEARCH_IMAGE:-itzcrazykns1337/perplexica:latest}
    build:
      context: ../../Perplexica
      dockerfile: Dockerfile
    container_name: smartsearch
    ports:
      - "3001:3000"
    volumes:
      - smartsearch_data:/home/perplexica/data
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "6"

volumes:
  # ⚠ All volumes use explicit fixed names so they are NEVER affected by
  #   the compose project name. Rename here only if you want a fresh volume.
  # Necessary for persisting data for use
  db_volume:
    name: onyx-stack_db_volume
  opensearch_data:
    name: onyx-stack_opensearch_data
  minio_data:
    name: onyx-stack_minio_data
  # Model weights for the OpenAI-compatible embedding server (vllm / tei profiles)
  cortex_hf_cache:
    name: onyx-stack_cortex_hf_cache
  # Logs preserved across container restarts
  api_server_logs:
    name: onyx-stack_api_server_logs
  background_logs:
    name: onyx-stack_background_logs
  pulse_logs:
    name: virtualai_pulse_logs
  # mcp_server_logs:
  # Shared volume for persistent document storage (Craft file-system mode)
  file-system:
    name: onyx-stack_file-system
  # Craft templates (venv + npm deps), shared between api_server and background
  craft-templates:
    name: onyx-stack_craft-templates
  # SmartSearch AI (Perplexica) data
  smartsearch_data:
    name: onyx-stack_smartsearch_data
  # Arize Phoenix observability data
  phoenix_data:
    name: onyx-stack_phoenix_data
