# Docker Compose Override for Windows Development
# This file exposes service ports and maps volumes to E:/temp/vert
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.dev-windows.yml up -d --build --wait
#
# Or set COMPOSE_FILE environment variable:
#   export COMPOSE_FILE=docker-compose.yml:docker-compose.dev-windows.yml
#   docker compose up -d --build --wait

services:
  api_server:
    build:
      args:
        # Skip expensive Craft template setup at build time (created at runtime instead)
        - PREBAKE_CRAFT_TEMPLATES=false
    ports:
      - "8080:8080"
    environment:
      # Disable telemetry and error reporting
      - DISABLE_TELEMETRY=true
      - SENTRY_DSN=
      # Code Interpreter: tell api_server where the service lives
      - CODE_INTERPRETER_BASE_URL=${CODE_INTERPRETER_BASE_URL:-http://code-interpreter:8000}
    volumes:
      - E:/temp/vert/api_server_logs:/var/log/om
      - E:/temp/vert/file-system:/app/file-system
      - craft-templates:/app/om/server/features/build/sandbox/kubernetes/docker/templates
      # Dev bind mounts: local source → container (restart to pick up changes, no rebuild needed)
      # Do NOT bind-mount scripts/ — they need CRLF stripping done at build time
      - ../../backend/om:/app/om
      - ../../backend/ee:/app/ee
      - ../../backend/shared_configs:/app/shared_configs
      - ../../backend/alembic:/app/alembic
      - ../../backend/alembic_tenants:/app/alembic_tenants
      # Folder connector test data — host E:\test_folder_data → container /test_folder_data
      - E:/test_folder_data:/test_folder_data

  background:
    build:
      args:
        # Must match api_server — both share the same image
        - PREBAKE_CRAFT_TEMPLATES=false
    depends_on:
      - api_server
    # CRLF line endings are now fixed at build time in the Dockerfile
    environment:
      # Disable telemetry and error reporting
      - DISABLE_TELEMETRY=true
      - SENTRY_DSN=
    volumes:
      - E:/temp/vert/background_logs:/var/log/om
      - E:/temp/vert/file-system:/app/file-system
      - craft-templates:/app/om/server/features/build/sandbox/kubernetes/docker/templates
      # Dev bind mounts: same as api_server
      - ../../backend/om:/app/om
      - ../../backend/ee:/app/ee
      - ../../backend/shared_configs:/app/shared_configs
      - ../../backend/alembic:/app/alembic
      - ../../backend/alembic_tenants:/app/alembic_tenants
      # Folder connector test data (must match api_server mount)
      - E:/test_folder_data:/test_folder_data

  # Pulse (scheduled workflows): same dev bind mounts as background so code changes
  # are picked up with a restart. scripts/ is NOT mounted (CRLF fixed at build time).
  pulse_scheduler:
    depends_on:
      - api_server
    environment:
      - DISABLE_TELEMETRY=true
      - SENTRY_DSN=
    volumes:
      - E:/temp/vert/pulse_logs:/var/log/om
      - ../../backend/om:/app/om
      - ../../backend/ee:/app/ee
      - ../../backend/shared_configs:/app/shared_configs

  pulse_worker:
    depends_on:
      - api_server
    environment:
      - DISABLE_TELEMETRY=true
      - SENTRY_DSN=
    volumes:
      - E:/temp/vert/pulse_logs:/var/log/om
      - E:/temp/vert/file-system:/app/file-system
      - ../../backend/om:/app/om
      - ../../backend/ee:/app/ee
      - ../../backend/shared_configs:/app/shared_configs
      # Folder connector test data (must match api_server mount)
      - E:/test_folder_data:/test_folder_data

  web_server:
    environment:
      - NEXT_PUBLIC_SENTRY_DSN=
      - SENTRY_AUTH_TOKEN=
      - NEXT_PUBLIC_POSTHOG_KEY=
      - NEXT_PUBLIC_POSTHOG_HOST=

  # Uncomment the block below to enable the MCP server for VertualAI.
  # mcp_server:
  #   ports:
  #     - "8090:8090"

  relational_db:
    ports:
      - "5432:5432"
    volumes:
      - E:/temp/vert/db:/var/lib/postgresql/data

  # Store OpenSearch data on the host instead of a Docker named volume.
  # This bind replaces the base opensearch_data named volume (same target path).
  # NOTE: OpenSearch runs as uid 1000 and is strict about data-dir permissions. If
  # it fails to start with "failed to obtain node locks" / AccessDenied, revert to
  # the named volume by removing this override.
  opensearch:
    volumes:
      - E:/temp/vert/opensearch:/usr/share/opensearch/data

  # Cortex: OpenAI-compatible embeddings/reranking (replaces the inference/indexing model servers).
  # Model weights cache on the host, like the other dev data.
  cortex_embed_vllm:
    volumes:
      - E:/temp/vert/cortex_hf_cache:/root/.cache/huggingface

  cortex_embed_tei:
    volumes:
      - E:/temp/vert/cortex_hf_cache:/data

  cortex_rerank_vllm:
    volumes:
      - E:/temp/vert/cortex_hf_cache:/root/.cache/huggingface

  cache:
    ports:
      - "6379:6379"

  minio:
    # use different ports to avoid conflicts with other local services
    ports:
      - "9004:9000"
      - "9005:9001"
    volumes:
      - E:/temp/vert/minio_data:/data

  code-interpreter:
    ports:
      # Loopback only: the service runs arbitrary code; never publish it on 0.0.0.0.
      # Containers reach it as http://code-interpreter:8000 on the compose network.
      # Host port 8001 (not 8000): on this machine a Windows portproxy rule can hold 8000.
      - "127.0.0.1:8001:8000"
    environment:
      - MEMORY_LIMIT_MB=1024
      - CPU_TIME_LIMIT_SEC=30

  phoenix:
    ports:
      - "6006:6006"
    volumes:
      - E:/temp/vert/phoenix_data:/phoenix_data

  # SmartSearch AI (Perplexica) — AI-powered web search
  # Builds from local source at ../../Perplexica (repo root/Perplexica)
  # Note: Next.js compiles to .next/standalone — source bind-mounting won't work.
  # To pick up source changes, rebuild: docker compose ... build smartsearch
  smartsearch:
    build:
      context: ../../Perplexica
      dockerfile: Dockerfile
    ports:
      - "3001:3000"
    volumes:
      - E:/temp/vert/smartsearch_data:/home/perplexica/data
      # Mount SearxNG config so we can tweak search engines without rebuilding
      - ../../Perplexica/searxng/settings.yml:/etc/searxng/settings.yml
      # Mount uploads directory for persistence
      - E:/temp/vert/smartsearch_uploads:/home/perplexica/uploads

volumes:
  craft-templates:
