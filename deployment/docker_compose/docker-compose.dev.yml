# Docker Compose Override for Development/Testing
# This file exposes service ports for development and testing purposes
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --wait
#
# Or set COMPOSE_FILE environment variable:
#   export COMPOSE_FILE=docker-compose.yml:docker-compose.dev.yml
#   docker compose up -d --wait

services:
  api_server:
    ports:
      - "8080:8080"

  # Uncomment the block below to enable the MCP server for VertualAI.
  # mcp_server:
  #   ports:
  #     - "8090:8090"

  relational_db:
    ports:
      - "5432:5432"

  cache:
    ports:
      - "6379:6379"

  minio:
    # use different ports to avoid conflicts with other local services
    ports:
      - "9004:9000"
      - "9005:9001"

  code-interpreter:
    ports:
      # Loopback only: the service runs arbitrary code.
      - "127.0.0.1:8000:8000"
