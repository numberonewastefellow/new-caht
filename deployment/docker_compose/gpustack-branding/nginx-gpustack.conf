server {
    listen 80;
    server_name _;

    # Serve custom branding assets
    location /custom/ {
        alias /usr/share/nginx/branding/;
        expires 1h;
        add_header Cache-Control "public, immutable";
    }

    # Proxy everything else to GPUStack
    location / {
        proxy_pass http://gpustack:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Inject custom CSS and JS into HTML responses
        sub_filter '</head>' '<link rel="stylesheet" href="/custom/custom.css"></head>';
        sub_filter '</body>' '<script src="/custom/custom.js"></script></body>';
        sub_filter_once on;
        sub_filter_types text/html;

        # Required for sub_filter to work with gzipped responses
        proxy_set_header Accept-Encoding "";

        # WebSocket support (for streaming/live updates)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts for model operations
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }
}
