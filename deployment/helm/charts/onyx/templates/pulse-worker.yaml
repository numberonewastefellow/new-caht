{{- if .Values.pulse.enabled }}
{{- $workers := list
  (dict "name" "pulse-worker" "queue" "pulse" "settings" .Values.pulse.worker)
  (dict "name" "pulse-webhook-worker" "queue" "pulse_webhook" "settings" .Values.pulse.webhookWorker) }}
{{- range $worker := $workers }}
{{- if gt (int $worker.settings.replicaCount) 0 }}
---
# Pulse worker — Celery worker consuming its queue: `pulse` for scheduled runs,
# `pulse_webhook` for webhook runs, so a burst of webhook calls can't delay a schedule.
# Runs can take up to ~30 min, so the grace period lets in-flight runs finish on
# scale-down / rollout (Celery warm shutdown on SIGTERM).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "onyx.fullname" $ }}-{{ $worker.name }}
  labels:
    {{- include "onyx.labels" $ | nindent 4 }}
    {{- with $worker.settings.deploymentLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  {{- if not $worker.settings.autoscaling.enabled }}
  replicas: {{ $worker.settings.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "onyx.selectorLabels" $ | nindent 6 }}
      {{- if $worker.settings.deploymentLabels }}
      {{- toYaml $worker.settings.deploymentLabels | nindent 6 }}
      {{- end }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") $ | sha256sum }}
      {{- with $worker.settings.podAnnotations }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "onyx.labels" $ | nindent 8 }}
        {{- with $worker.settings.deploymentLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- with $worker.settings.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with $.Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "onyx.serviceAccountName" $ }}
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml $.Values.pulse.podSecurityContext | nindent 8 }}
      terminationGracePeriodSeconds: {{ $worker.settings.terminationGracePeriodSeconds | default 1900 }}
      {{- with $worker.settings.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $worker.settings.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $worker.settings.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ $worker.name }}
          securityContext:
            {{- toYaml $.Values.pulse.securityContext | nindent 12 }}
          image: "{{ $.Values.pulse.image.repository }}:{{ $.Values.pulse.image.tag | default $.Values.global.version }}"
          imagePullPolicy: {{ $.Values.global.pullPolicy }}
          # entrypoint `worker` runs:
          #   celery -A om.background.celery.versioned_apps.pulse_worker worker -Q $PULSE_WORKER_QUEUE
          #     --pool=threads --concurrency=$PULSE_WORKER_CONCURRENCY
          #     --prefetch-multiplier=1 --hostname=$PULSE_WORKER_QUEUE@%h
          command: ["/app/scripts/pulse_entrypoint.sh"]
          args: ["worker"]
          resources:
            {{- toYaml $worker.settings.resources | nindent 12 }}
          envFrom:
            - configMapRef:
                name: {{ $.Values.config.envConfigMapName }}
          env:
            {{- include "onyx.envSecrets" $ | nindent 12 }}
            - name: PULSE_ROLE
              value: "worker"
            - name: PULSE_WORKER_QUEUE
              value: {{ $worker.queue | quote }}
            - name: PULSE_WORKER_CONCURRENCY
              value: {{ $worker.settings.concurrency | default 4 | toString | quote }}
            - name: PULSE_LOG_LEVEL
              value: {{ $worker.settings.logLevel | default "INFO" | quote }}
            {{- range $name, $value := $.Values.pulse.env }}
            - name: {{ $name | quote }}
              value: {{ $value | toString | quote }}
            {{- end }}
            {{- range $name, $value := $worker.settings.env }}
            - name: {{ $name | quote }}
              value: {{ $value | toString | quote }}
            {{- end }}
          {{- with $worker.settings.volumeMounts }}
          volumeMounts:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          # The entrypoint's `healthcheck` passes once Celery has written its
          # worker_ready marker (/tmp/*_k8s_pulse*_readiness.txt).
          startupProbe:
            {{- toYaml $worker.settings.startupProbe | nindent 12 }}
            exec:
              command: ["/app/scripts/pulse_entrypoint.sh", "healthcheck"]
          readinessProbe:
            {{- toYaml $worker.settings.readinessProbe | nindent 12 }}
            exec:
              command: ["/app/scripts/pulse_entrypoint.sh", "healthcheck"]
          livenessProbe:
            {{- toYaml $worker.settings.livenessProbe | nindent 12 }}
            exec:
              command: ["/app/scripts/pulse_entrypoint.sh", "healthcheck"]
      {{- with $worker.settings.volumes }}
      volumes:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
{{- end }}
{{- end }}
